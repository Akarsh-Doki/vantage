# CI test pyramid, zero API spend by construction: no Anthropic, Tavily, or
# Supabase secrets exist in this workflow, and every tier mocks those
# boundaries (conftest fixtures backend-side, a local auth emulator plus
# page.route frontend-side). A test that tried to hit a real API would fail
# on missing credentials rather than spend money.

name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: backend unit + integration (mocked LLM and Tavily)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m ruff check app tests evals
      - run: python -m mypy app
      # Unit tier (graph routing, validators, parsers, tools) plus the
      # integration tier (real FastAPI app driving the real compiled graph).
      # The rls marker is deselected by default (pyproject addopts).
      - run: python -m pytest -q
      # The eval harness must still parse the output schema; dry-run is $0.
      - run: python -m evals.run_eval --dry-run

  backend-rls:
    name: RLS policies on real Postgres (real migrations)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m pytest -q -o addopts="" -m rls
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:55432/postgres

  frontend-e2e:
    name: frontend typecheck + Playwright E2E (all network mocked)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx playwright install --with-deps chromium
      # playwright.config.ts starts the Supabase auth emulator and a
      # production Next build on port 3100; specs mock the backend API.
      - run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/test-results/
          retention-days: 7
